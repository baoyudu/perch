version: 2
project_name: psw

before:
  hooks:
    - go mod tidy

builds:
  - id: psw
    main: ./cmd/psw
    binary: psw
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "psw_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Publishes a cask to github.com/baoyudu/homebrew-tap on `goreleaser release`.
homebrew_casks:
  - name: psw
    repository:
      owner: baoyudu
      name: homebrew-tap
    homepage: https://github.com/baoyudu/psw
    description: "Jump between recent Claude Code / Codex projects and relaunch your agent"
    caveats: |
      Add to your shell rc file:
        eval "$(psw init zsh)"    # or bash / fish
      Then run: p
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/psw"]
          end
